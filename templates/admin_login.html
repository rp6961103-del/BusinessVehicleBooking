<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ADMIN LOGIN | Business Vehicle Booking</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="admin-auth-page">
    <div class="admin-auth-wrapper">
        <div class="admin-auth-brand">
            <span class="admin-auth-logo-mark" aria-hidden="true">🚜</span>
            <div class="admin-auth-brand-text">
                <span class="admin-auth-brand-title">Business Vehicle Booking</span>
                <span class="admin-auth-brand-badge">Control Center</span>
            </div>
        </div>

        <main class="admin-auth-card">
            <div class="admin-auth-card-header">
                <div class="admin-badge-pill">Security Clearance</div>
                <h1>ADMIN LOGIN</h1>
                <p>Sign in to access platform management and real-time operations.</p>
            </div>

            {% if error %}
            <div class="admin-alert-box admin-alert-danger" role="alert">
                <span class="admin-alert-icon">⚠️</span>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="{{ login_action or url_for('configured_admin_login') }}" class="admin-auth-form" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="admin-form-group">
                    <label for="admin-username" class="admin-form-label">Username</label>
                    <div class="admin-input-wrapper">
                        <span class="admin-input-icon">👤</span>
                        <input
                            type="text"
                            id="admin-username"
                            name="username"
                            class="admin-form-control"
                            placeholder="Enter admin username"
                            maxlength="100"
                            required
                            autocomplete="username"
                            autofocus
                        >
                    </div>
                </div>

                <div class="admin-form-group">
                    <label for="admin-password" class="admin-form-label">Password</label>
                    <div class="admin-input-wrapper">
                        <span class="admin-input-icon">🔒</span>
                        <input
                            type="password"
                            id="admin-password"
                            name="password"
                            class="admin-form-control"
                            placeholder="Enter admin password"
                            required
                            autocomplete="current-password"
                        >
                    </div>
                </div>

                <button type="submit" class="admin-btn admin-btn-primary admin-btn-block">
                    <span>Login</span>
                    <span class="admin-btn-arrow" aria-hidden="true">→</span>
                </button>
            </form>

            <div class="admin-auth-footer">
                <a href="{{ url_for('home') }}" class="admin-auth-back-link">
                    <span aria-hidden="true">←</span> Back to Public Site
                </a>
            </div>
        </main>

        <footer class="admin-auth-copyright">
            &copy; 2026 Business Vehicle Booking &bull; Administrative Systems
        </footer>
    </div>
</body>
</html>
