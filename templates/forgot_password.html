<!DOCTYPE html>
<html lang="{{ current_language or 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Business Vehicle Booking</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="container container-narrow">
    <div class="form-card">
        <h1>Reset Customer Password</h1>
        <p class="subtitle">Enter your registered email address.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}" role="alert">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST" action="{{ url_for('forgot_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="email">Registered Email</label>
                <input type="email" id="email" name="email" maxlength="255" required autocomplete="email">
            </div>
            <button type="submit" class="btn btn-primary full-btn">Send Reset Link</button>
        </form>
        <p style="margin-top:18px;text-align:center;"><a href="{{ url_for('login') }}">Back to Customer Login</a></p>
    </div>
</main>
</body>
</html>
