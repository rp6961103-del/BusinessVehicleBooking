<!DOCTYPE html>
<html lang="{{ current_language or 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Business Vehicle Booking</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="container container-narrow">
    <div class="form-card">
        <h1>Set a New Password</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}" role="alert">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST" action="{{ url_for('reset_password', token=token) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" minlength="8" maxlength="128" required autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" minlength="8" maxlength="128" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary full-btn">Reset Password</button>
        </form>
    </div>
</main>
</body>
</html>
